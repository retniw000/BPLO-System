<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taguig BPLO | Business Permit System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --navy: #1e3a8a;
            --red:  #dc2626;
            --bg:   #f1f3f7;
            --border: #e2e6ed;
            --text: #0f172a;
            --muted: #64748b;
            --faint: #94a3b8;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAV */
        nav {
            background: #fff;
            border-bottom: 1px solid var(--border);
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 36px;
            border-top: 2px solid var(--red);
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img { height: 32px; }
        .brand-sep { width: 1px; height: 20px; background: var(--border); }

        .brand-city {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--navy);
            display: block;
            line-height: 1.2;
        }

        .brand-dept {
            font-size: 0.65rem;
            color: var(--faint);
            display: block;
        }

        /* MAIN */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-image: url('white_bg_city.png');
            background-size: cover;
            background-position: center;
        }

        /* CARD */
        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .card img {
            height: 56px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .card h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .card p {
            font-size: 0.82rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.15s, transform 0.15s;
        }

        .btn:hover { opacity: 0.88; transform: translateY(-1px); }

        .btn-red {
            background: var(--red);
            color: #fff;
        }

        .btn-outline {
            background: transparent;
            color: var(--navy);
            border: 1px solid var(--border);
        }

        .btn-outline:hover { background: var(--bg); }

        
    </style>
</head>
<body>

    <nav>
        <div class="brand">
            <img src="City_of_Taguig_seal.svg.png" alt="Taguig Seal">
            <div class="brand-sep"></div>
            <div>
                <span class="brand-city">City of Taguig</span>
                <span class="brand-dept">Business Permits &amp; Licensing Office</span>
            </div>
        </div>
    </nav>

    <main>
        <div class="card">
            <img src="City_of_Taguig_seal.svg.png" alt="Taguig City Seal">
            <h1>Business Permit Application</h1>
            <p>This is not an official government website.</p>
            <div class="btns">
                <a href="ManualForm.html" class="btn btn-red">
                    <i class="fa-solid fa-pen-to-square"></i> Submit Application
                </a>
                <a href="login.html" class="btn btn-outline">
                    <i class="fa-solid fa-lock"></i> View Records
                </a>
            </div>
        </div>
    </main>



</body>
</html>
