<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taguig BPLO | Unified Business Permit System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --blue:      #1e3a8a;
            --blue-soft: #eff6ff;
            --blue-mid:  #dbeafe;
            --red:       #dc2626;
            --red-dark:  #b91c1c;
            --red-soft:  #fef2f2;
            --gray-50:   #f9fafb;
            --gray-100:  #f3f4f6;
            --gray-300:  #d1d5db;
            --gray-400:  #9ca3af;
            --gray-500:  #6b7280;
            --gray-600:  #4b5563;
            --gray-900:  #111827;
            --white:     #ffffff;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--white);
            color: var(--gray-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── NAV ── */
        nav {
            border-top: 3px solid var(--red);
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid var(--gray-300);
            background: var(--white);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-logo { height: 42px; }

        .nav-divider {
            width: 1px;
            height: 30px;
            background: var(--gray-300);
        }

        .nav-text span { display: block; line-height: 1.25; }

        .nav-republic {
            font-size: 0.68rem;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .nav-city {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.97rem;
            font-weight: 800;
            color: var(--blue);
        }

        .nav-office {
            font-size: 0.73rem;
            font-weight: 500;
            color: var(--gray-600);
        }

        /* ── MAIN ── */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: var(--gray-50);
            background-image: url('white_bg_city.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ── CARD ── */
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 56px 52px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--gray-300);
            box-shadow:
                0 1px 2px rgba(0,0,0,0.04),
                0 8px 32px rgba(0,0,0,0.07);
            position: relative;
            overflow: hidden;
        }

        /* subtle blue top border accent */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--blue);
            border-radius: 16px 16px 0 0;
        }

        .card-seal {
            height: 68px;
            margin-bottom: 24px;
            opacity: 0.92;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--red);
            background: var(--red-soft);
            padding: 5px 13px;
            border-radius: 100px;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--blue);
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 0.97rem;
            color: var(--gray-500);
            line-height: 1.65;
            margin-bottom: 36px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ── BUTTONS ── */
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 26px;
            font-size: 0.93rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.18s ease;
            cursor: pointer;
            border: 1.5px solid transparent;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--red);
            color: var(--white);
            border-color: var(--red);
            box-shadow: 0 2px 8px rgba(220,38,38,0.22);
        }
        .btn-primary:hover {
            background: var(--red-dark);
            border-color: var(--red-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(220,38,38,0.3);
        }

        .btn-ghost {
            background: var(--blue-soft);
            color: var(--blue);
            border-color: var(--blue-mid);
        }
        .btn-ghost:hover {
            background: var(--blue-mid);
            transform: translateY(-2px);
        }

        /* ── FOOTER ── */
        footer {
            padding: 14px 40px;
            border-top: 1px solid var(--gray-100);
            text-align: center;
            font-size: 0.73rem;
            color: var(--gray-400);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            nav { padding: 0 20px; }
            .card { padding: 40px 24px; }
            h1 { font-size: 1.6rem; }
            .actions { flex-direction: column; }
            .btn { justify-content: center; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">
            <img src="City_of_Taguig_seal.svg.png" alt="Taguig Seal" class="nav-logo">
            <div class="nav-divider"></div>
            <div class="nav-text">
                <span class="nav-republic">Republic of the Philippines</span>
                <span class="nav-city">City of Taguig</span>
                <span class="nav-office">Business Permits &amp; Licensing Office</span>
            </div>
        </div>
    </nav>

    <main>
        <div class="card">

            <img src="City_of_Taguig_seal.svg.png" alt="Taguig City Seal" class="card-seal">

            <div class="tag">
                <i class="fa-solid fa-file-contract"></i> Unified System
            </div>

            <h1>Unified Business<br>Permit Application</h1>

            <p class="subtitle">
                Process your business licensing requirements quickly and securely — all in one place.
            </p>

            <div class="actions">
                <a href="ManualForm.html" class="btn btn-primary">
                    <i class="fa-solid fa-pen-to-square"></i> Submit Application
                </a>
                <a href="login.html" class="btn btn-ghost">
                    <i class="fa-solid fa-lock"></i> View Records
                </a>
            </div>

        </div>
    </main>

  

</body>
</html>
