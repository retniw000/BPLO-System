<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Business License System, City of Taguig</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <div class="login-card">
    <div class="login-header">
      <img src="City_of_Taguig_seal.svg.png" alt="City of Taguig Seal" class="login-seal" onerror="this.style.display='none'" />
      <div class="login-gov">Republic of the Philippines</div>
      <div class="login-city">City of Taguig</div>
      <div class="login-office">Business Permits &amp; Licensing Office</div>
    </div>

    <div class="login-body">
      <h2>Admin Sign In</h2>
      <p>Enter your credentials to access the system.</p>

      <div class="login-error" id="loginError">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="loginErrorMsg">Invalid username or password.</span>
      </div>

      <div class="login-field">
        <label for="loginUsername">Username</label>
        <div class="login-input-wrap">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="loginUsername" placeholder="Enter username" autocomplete="username" />
        </div>
      </div>

      <div class="login-field">
        <label for="loginPassword">Password</label>
        <div class="login-input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password" />
          <button type="button" class="show-pw-btn" id="togglePw" title="Show / hide password">
            <i class="fa-solid fa-eye" id="togglePwIcon"></i>
          </button>
        </div>
      </div>

      <button class="login-btn" id="loginBtn" onclick="handleLogin()">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>

      <p class="login-footer-note">Not an official government system &mdash; for academic use only.</p>
    </div>
  </div>

  <script>
    (function () {
      const VALID_USER  = 'admin';
      const VALID_PASS  = 'password123';
      const SESSION_KEY = 'bplo_auth';

      const userInput  = document.getElementById('loginUsername');
      const passInput  = document.getElementById('loginPassword');
      const errorBox   = document.getElementById('loginError');
      const errorMsg   = document.getElementById('loginErrorMsg');
      const loginBtn   = document.getElementById('loginBtn');
      const toggleBtn  = document.getElementById('togglePw');
      const toggleIcon = document.getElementById('togglePwIcon');

      if (sessionStorage.getItem(SESSION_KEY) === '1') {
        window.location.replace('dashboard.html');
      }

      toggleBtn.addEventListener('click', function () {
        const hidden = passInput.type === 'password';
        passInput.type       = hidden ? 'text' : 'password';
        toggleIcon.className = hidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      });

      [userInput, passInput].forEach(function (el) {
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') handleLogin();
        });
      });

      window.handleLogin = function () {
        const user = userInput.value.trim();
        const pass = passInput.value;

        errorBox.classList.remove('show');
        userInput.classList.remove('input-error');
        passInput.classList.remove('input-error');

        if (!user || !pass) {
          errorMsg.textContent = 'Please enter both username and password.';
          errorBox.classList.add('show');
          if (!user) userInput.classList.add('input-error');
          if (!pass) passInput.classList.add('input-error');
          return;
        }

        if (user === VALID_USER && pass === VALID_PASS) {
          sessionStorage.setItem(SESSION_KEY, '1');
          loginBtn.disabled  = true;
          loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in\u2026';
          setTimeout(function () {
            window.location.replace('dashboard.html');
          }, 380);
        } else {
          errorMsg.textContent = 'Invalid username or password. Please try again.';
          errorBox.classList.add('show');
          userInput.classList.add('input-error');
          passInput.classList.add('input-error');
          passInput.value = '';
          passInput.focus();
        }
      };
    })();
  </script>
</body>
</html>
